---
name: CI
on:
  push:
    # main gets the post-merge run. renovate/** is required because the shared
    # preset automerges MOST updates by branch (:automergeBranch) rather than
    # by PR, so those branches would reach the ruleset with zero status checks
    # and :automergeRequireAllStatusChecks would block them indefinitely.
    # Majors and security bumps still open a PR, covered by pull_request below.
    branches: [main, 'renovate/**']
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    # go-build is a composite action, so this job owns runs-on. Keep it hosted:
    # on a fork pull_request the checked-out code is untrusted and `go test`
    # executes it.
    runs-on: ubuntu-latest
    steps:
      - uses: jabrown93/ci/actions/go-build@8fe0eb3180145756cdb71b2fd38a419ec981a226 # go-build-v1.0.1
