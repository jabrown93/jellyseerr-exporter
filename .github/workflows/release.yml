name: Release

on:
  push:
    branches:
      - main
  # Weekly roll-up of the chore(deps) commits that the shared preset
  # suppresses on push, promoted into a single patch release (RELEASE_DEPS).
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Also sets RELEASE_DEPS, so a manual run is an on-demand dependency sweep.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jabrown93/ci/.github/workflows/docker-release.yml@c8974ae4b64382b9899254f57e0d8270eb769c03 # workflows-v3.0.1
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  image:
    name: Build & push image
    needs: release
    # This job MUST live here, in this repo's own workflow file -- not inside
    # another reusable workflow -- so cosign's keyless-signing Fulcio cert
    # SAN carries this repo's identity, not jabrown93/ci's. verify-ghcr-images
    # (Kyverno) trusts only that identity. See jabrown93/ci's
    # actions/docker-image README section for the full rationale.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: jabrown93/ci/actions/docker-image@3b3f9d74d9c06b48e8f7e1cc9ae8bacf927ca1b4 # docker-image-v1.0.0
        with:
          image: ghcr.io/jabrown93/jellyseerr-exporter
          version: ${{ needs.release.outputs.version }}
          channel: ${{ needs.release.outputs.channel }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
