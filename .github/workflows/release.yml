name: Release

on:
  push:
    branches:
      - main
  # Weekly roll-up of the fix(deps) commits that the shared preset suppresses
  # on push, promoted into a single patch release (RELEASE_DEPS).
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Also sets RELEASE_DEPS, so a manual run is an on-demand dependency sweep.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jabrown93/ci/.github/workflows/docker-release.yml@ae4c0bc7c75c6d86853aad5dbc830dfa6607c446 # workflows-v2.1.4
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      image: ghcr.io/jabrown93/jellyseerr-exporter
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
